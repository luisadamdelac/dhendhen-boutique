<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Rounded-square backdrop -->
  <rect width="200" height="200" rx="28" fill="#f2f3f5"/>

  <!-- Circle plate -->
  <circle cx="100" cy="100" r="92" fill="#c9ccd1"/>

  <clipPath id="avatarClip">
    <circle cx="100" cy="100" r="92"/>
  </clipPath>

  <!-- Person silhouette, clipped to the circle -->
  <g clip-path="url(#avatarClip)" fill="#eef0f2">
    <circle cx="100" cy="82" r="34"/>
    <path d="M38 214 C38 150 162 150 162 214 Z"/>
  </g>
</svg>
